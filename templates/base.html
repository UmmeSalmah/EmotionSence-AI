<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EmotionSense AI{% endblock %}</title>

  <!-- ✅ BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- ✅ FONT AWESOME -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <!-- ✅ GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* 🌈 Pastel Gradient Background */
    body {
        background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
        background-size: 400% 400%;
        animation: gradientShift 12s ease infinite;
        font-family: 'Poppins', sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* ✨ Floating Emoji Background */
    .emoji-bg span {
        position: absolute;
        font-size: 2rem;
        animation: float 12s infinite;
        opacity: 0.6;
        user-select: none;
    }
    @keyframes float {
        0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
        20% { opacity: 0.7; }
        50% { opacity: 1; }
        80% { opacity: 0.7; }
        100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* 🌟 NAVBAR */
    .navbar {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 20px rgba(255, 182, 193, 0.4);
        padding: 14px 25px;
        border-radius: 0 0 20px 20px;
        z-index: 10;
    }

    /* 🌈 Gradient Logo */
    .navbar-brand {
        font-family: 'Raleway', sans-serif;
        font-weight: 700;
        font-size: 1.8rem;
        background: linear-gradient(90deg, #ff6ec7, #a777e3, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* 🔗 Navbar Links */
    .navbar .nav-link {
        font-weight: 600;
        color: #444 !important;
        margin-left: 12px;
        padding: 6px 14px;
        border-radius: 12px;
        transition: all 0.3s ease;
        background-color: rgba(255, 255, 255, 0.3);
        display: inline-block;
    }
    .navbar .nav-link:hover {
        background-color: rgba(255, 255, 255, 0.6);
        transform: translateY(-2px);
    }

    /* 🚪 Logout Button Special Style */
    .logout-btn {
        background-color: #ffb3c6;
        color: white !important;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 10px;
        transition: all 0.3s ease;
    }
    .logout-btn:hover {
        background-color: #ff99af;
        transform: scale(1.05);
    }

    /* 🏷 Main Content */
    main {
        position: relative;
        z-index: 5;
        flex: 1;
    }

    /* 🌸 Footer */
    footer {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(12px);
        box-shadow: 0 -4px 15px rgba(255, 182, 193, 0.3);
        text-align: center;
        padding: 15px;
        font-size: 0.9rem;
        color: #444;
        border-radius: 20px 20px 0 0;
    }
    footer a {
        color: #ff6ec7;
        text-decoration: none;
        margin: 0 10px;
        font-size: 1.2rem;
        transition: 0.3s ease;
    }
    footer a:hover {
        color: #a777e3;
        transform: scale(1.2);
    }
  </style>
</head>

<body>
<!-- ✨ Floating Emojis -->
<div class="emoji-bg">
  <span style="left: 10%; animation-delay: 0s;">😊</span>
  <span style="left: 25%; animation-delay: 2s;">🌸</span>
  <span style="left: 40%; animation-delay: 4s;">💫</span>
  <span style="left: 60%; animation-delay: 6s;">🌈</span>
  <span style="left: 75%; animation-delay: 8s;">💖</span>
  <span style="left: 90%; animation-delay: 10s;">✨</span>
</div>

<!-- 🌸 NAVBAR -->
<nav class="navbar">
  <div class="container d-flex justify-content-between align-items-center">
      <!-- ✅ Gradient Logo -->
      <a class="navbar-brand" href="{{ url_for('home') }}">🤖 EmotionSense AI</a>
      
      <!-- ✅ Right Side Links -->
      <div>
          <a class="nav-link" href="{{ url_for('about') }}">📄 About</a>
          {% if session.get('user_id') %}
              <a class="nav-link logout-btn" href="{{ url_for('logout') }}">🚪 Logout</a>
          {% else %}
              <a class="nav-link" href="{{ url_for('login') }}">🔑 Login</a>
              <a class="nav-link" href="{{ url_for('register') }}">📝 Register</a>
          {% endif %}
      </div>
  </div>
</nav>

<!-- ✅ MAIN CONTENT -->
<main class="container my-5">
    {% block content %}{% endblock %}
</main>

<!-- 🌸 Footer -->
<footer>
    <p>✨ Made with 💖 by EmotionSense AI | © 2025</p>
    <div>
        <a href="#"><i class="fab fa-github"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
    </div>
</footer>

<!-- ✅ BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
